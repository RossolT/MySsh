<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MySsh Terminal</title>
		<link rel="stylesheet" href="xterm.css" />
		<style>
			* {
			box-sizing: border-box;
			}
			html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #1e2024;
			}
			#terminal {
			position: fixed;
			inset: 0;
			padding: 6px 8px;
			overflow: hidden;
			background: #1e2024;
			}
			.xterm {
			width: 100%;
			height: 100%;
			}
			.xterm-viewport {
			overflow-y: auto !important;
			scrollbar-width: thin;
			scrollbar-color: #3a3f4b #1e2024;
			}
		</style>
	</head>
	<body>
		<div id="terminal"></div>

		<!-- xterm.js подключаем локально, без CDN -->
		<script src="xterm.js"></script>
		<script src="terminal.js"></script>
	</body>
</html>
